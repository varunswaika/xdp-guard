name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '52 3 * * 1'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6a52aad76a94a5fbc50d567bb5be24419801c1fb # nightly
        with:
          components: rust-src, clippy, rustfmt
      - name: Install bpf-linker
        run: |
          mkdir -p ~/.local/bin
          curl -sSfL https://github.com/aya-rs/bpf-linker/releases/download/v0.13.0/bpf-linker-x86_64-unknown-linux-musl.tar.zst |
            tar --zstd -x -C ~/.local/bin
          echo ~/.local/bin >> "$GITHUB_PATH"
      - run: make lint CARGO_FLAGS=
      - run: make check CARGO_FLAGS=
      - name: Build the netfilter module
        run: |
          sudo apt-get update
          sudo apt-get install -y "linux-headers-$(uname -r)"
          make module
