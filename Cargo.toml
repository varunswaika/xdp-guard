[workspace]
resolver = "3"
members = ["xdp-guard", "xdp-guard-common", "xdp-guard-ebpf"]
default-members = ["xdp-guard", "xdp-guard-common"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
aya = { version = "0.16", default-features = false }
aya-build = { version = "0.2", default-features = false }
aya-ebpf = { version = "0.3", default-features = false }
anyhow = "1"
cargo_metadata = { version = "0.23", default-features = false }
clap = { version = "4.5", features = ["derive"] }
which = { version = "6", default-features = false }

[profile.release.package.xdp-guard-ebpf]
debug = 2
codegen-units = 1
